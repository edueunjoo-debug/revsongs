<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계시록 노래</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="계시록 노래">
<meta name="theme-color" content="#f4f5f6">
<link rel="stylesheet" href="css/style.css?v=20260830t">
</head>
<body>

<header class="top">
  <div class="title-row">
    <h1>🎵 계시록 노래</h1>
  </div>
</header>

<main>

  <div class="card chapter-card">
    <h2>장 선택</h2>
    <div id="chapterGrid" class="chapter-grid"></div>
  </div>

  <div class="player-card" id="playerCard">
    <div class="player-head">
      <button class="btn ghost small" id="prevBtn">◀</button>
      <span id="chapterLabel" class="chapter-label"></span>
      <button class="btn ghost small" id="nextBtn">▶</button>
    </div>
    <div id="chapterTitleRow" class="chapter-title-row"></div>
    <audio id="mainAudio" preload="metadata"></audio>
    <div class="custom-player">
      <button type="button" id="playPauseBtn" class="play-toggle" aria-label="재생">
        <svg id="playIcon" viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" width="22" height="22" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <div class="progress-wrap">
        <input type="range" id="seekRange" class="seek-range" min="0" max="100" step="0.1" value="0">
        <div class="time-row">
          <span id="curTimeLabel">0:00</span>
          <span id="durTimeLabel">0:00</span>
        </div>
      </div>
    </div>
    <div class="row control-row">
      <button class="btn ghost small" id="seekBackBtn">◀5초</button>
      <button class="btn ghost small" id="seekFwdBtn">5초▶</button>
      <span class="speed-ctrl">
        <input type="range" id="speedSlider" min="0.8" max="2" step="0.1" value="1">
        <span id="speedLabel" class="small-note">1.0x</span>
      </span>
      <button class="btn small btn-tool" id="playAllBtn">전체 듣기</button>
      <button class="btn small btn-tool" id="chapterLoopBtn">이 장만 듣기</button>
      <button class="btn ghost small" id="adminToggleBtn" title="구간 표시 도구" aria-label="구간 표시 도구 보이기/숨기기">⚙</button>
    </div>
    <div class="row control-row" id="adminControlsRow" hidden>
      <button class="btn small btn-tool" id="guidedBtn">절 구간 표시</button>
      <button class="btn small btn-tool" id="clearMarksBtn">초기화</button>
    </div>
    <div class="player-sub">
      <span id="missingMsg" class="missing-audio" hidden>이 노래 파일을 찾을 수 없어요.</span>
      <span id="markCount" class="small-note" hidden></span>
    </div>
    <p class="hint" id="playAllHint" hidden></p>
    <div id="loopStatus" class="loop-status" hidden>
      <span id="loopStatusText"></span>
      <button class="btn ghost small" id="loopStopBtn">정지</button>
    </div>
  </div>

  <!-- deliberately OUTSIDE the sticky .player-card: toggling this panel's
       visibility used to resize the sticky element itself, and on some
       mobile WebKit builds that can leave the sticky box's hit-testing
       stale (buttons visible but not actually clickable until the page is
       scrolled/reflowed again) - see guidedBtn's click handler in app.js.
       Living as a plain sibling avoids resizing the sticky box at all. -->
  <div id="guidedPanel" class="guided-panel" hidden>
    <div id="guidedStatus" class="small-note"></div>
    <div class="row" style="margin-top:8px;">
      <button class="btn" id="guidedMarkBtn"></button>
      <button class="btn ghost small" id="guidedUndoBtn">↩ 되돌리기</button>
    </div>
  </div>

  <div id="verseList" class="verse-list"></div>

  <div class="card footer-card">
    <h2>기타</h2>
    <div class="row">
      <label class="btn ghost small" style="cursor:pointer;">이 장 곡 바꾸기
        <input type="file" id="chapterAudioInput" accept="audio/*" hidden>
      </label>
      <button class="btn ghost small" id="exportBtn">내보내기</button>
      <label class="btn ghost small" style="cursor:pointer;">가져오기
        <input type="file" id="importInput" accept="application/json" hidden>
      </label>
    </div>
    <div class="row" style="margin-top:8px;">
      <span id="chapterAudioStatus" class="small-note" hidden></span>
      <button class="btn ghost small" id="chapterAudioRevertBtn" hidden>원곡으로 되돌리기</button>
    </div>
  </div>

</main>

<script src="js/data.js?v=20260830t"></script>
<script src="js/verse-times.js?v=20260830t"></script>
<script src="js/app.js?v=20260830t"></script>
</body>
</html>
